<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student Registration Form – submit your details to register as a student.">
    <title>Student Registration | EduPortal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./project5.css">
</head>
<body>

    <div class="bg-shapes">
        <span class="shape shape-1"></span>
        <span class="shape shape-2"></span>
        <span class="shape shape-3"></span>
    </div>

    <div class="card">

        <!-- Header -->
        <div class="card-header">
            <div class="icon-wrap">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                </svg>
            </div>
            <h1>Student Registration</h1>
            <p class="subtitle">Fill in your details to get started</p>
        </div>

        <!-- Success Message (hidden by default) -->
        <div class="success-banner" id="successBanner" aria-live="polite" hidden>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <div>
                <strong>Registration Successful!</strong>
                <span id="successMsg"></span>
            </div>
        </div>

        <!-- Form -->
        <form id="studentForm" novalidate>

            <div class="form-row">
                <!-- First Name -->
                <div class="field-group">
                    <label for="firstName">First Name</label>
                    <div class="input-wrap">
                        <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="firstName" name="firstName" placeholder="e.g. Pawan" autocomplete="given-name" required>
                    </div>
                    <span class="error-msg" id="firstNameError"></span>
                </div>

                <!-- Last Name -->
                <div class="field-group">
                    <label for="lastName">Last Name</label>
                    <div class="input-wrap">
                        <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="lastName" name="lastName" placeholder="e.g. Kanwal" autocomplete="family-name" required>
                    </div>
                    <span class="error-msg" id="lastNameError"></span>
                </div>
            </div>

            <!-- Email -->
            <div class="field-group">
                <label for="email">Email Address</label>
                <div class="input-wrap">
                    <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                    </svg>
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                </div>
                <span class="error-msg" id="emailError"></span>
            </div>

            <!-- Age & Gender row -->
            <div class="form-row">
                <!-- Age -->
                <div class="field-group">
                    <label for="age">Age</label>
                    <div class="input-wrap">
                        <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>
                        <input type="number" id="age" name="age" placeholder="Your age" min="5" max="100" required>
                    </div>
                    <span class="error-msg" id="ageError"></span>
                </div>

                <!-- Course -->
                <div class="field-group">
                    <label for="course">Course</label>
                    <div class="input-wrap select-wrap">
                        <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
                        </svg>
                        <select id="course" name="course" required>
                            <option value="" disabled selected>Select course</option>
                            <option value="cs">Computer Science</option>
                            <option value="math">Mathematics</option>
                            <option value="physics">Physics</option>
                            <option value="commerce">Commerce</option>
                            <option value="arts">Arts & Humanities</option>
                        </select>
                        <svg class="chevron-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </div>
                    <span class="error-msg" id="courseError"></span>
                </div>
            </div>

            <!-- Submit -->
            <button type="submit" id="submitBtn">
                <span class="btn-text">Register Now</span>
                <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
                </svg>
            </button>
        </form>

    </div>

    <script src="./project5.js"></script>
</body>
</html>
